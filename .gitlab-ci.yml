# CI fuer BirdMic -- die gemeinsame Android-Vorlage plus das Eigene.
#
# Bis heute stand hier alles von Hand: SDK einrichten, Cache, Tests,
# APK. Das lief, aber jede Verbesserung an der Vorlage ging an diesem
# Projekt vorbei -- und umgekehrt blieb hier Gutes liegen, das die
# Vorlage nicht kannte. Die SDK-Einrichtung aus dieser Datei ist
# inzwischen die der Vorlage.
#
# Was die Vorlage mitbringt:
#   android:tests     JVM-Tests, und rot, wenn kein Testbericht entsteht
#   android:lint      liest den Lint-Bericht, statt ihn nur zu erzeugen
#   android:assemble  baut die APK, und rot, wenn am Ende keine da ist
#
# Die Tests in app/src/test/ brauchen kein Geraet und keinen Emulator.
# Sie decken DigestAuth, FFT, Hochpass, PacketQueue und RtpSender ab --
# genau den Teil, der still falsch rechnen kann, ohne dass die App
# abstuerzt.

include:
  - project: 'claude/ci-vorlagen'
    file: '/vorlagen/geheimnisse.yml'
    ref: 65c48c20f447f46baaa1a46cda655b656cca15e3
  - project: 'claude/ci-vorlagen'
    file: '/vorlagen/android.yml'
    ref: 65c48c20f447f46baaa1a46cda655b656cca15e3

# Die Vorlage bringt nur `build` und `test` mit und warnt zu Recht: Ein
# Job mit unbekanntem Stufennamen laesst die GANZE Pipeline vor dem ersten
# Job scheitern, auch die Jobs, die damit nichts zu tun haben. Deshalb
# stehen die Stufen hier ausdruecklich, sobald eine dritte dazukommt.
stages:
  - build
  - test
  - veroeffentlichen

variables:
  # Die Release-Variante nimmt die Debug-Signatur (siehe
  # app/build.gradle.kts) und baut damit ohne Keystore. Deshalb wird hier
  # gleich das gebaut, was auch verteilt wird -- und nicht eine
  # Debug-APK, die niemand bekommt.
  ANDROID_BAU_AUFGABE: "assembleRelease"

# Die fertige APK laenger aufheben als die sieben Tage der Vorlage: Sie
# ist das, was auf einem Geraet landet, und danach sucht man auch noch
# nach drei Wochen.
android:assemble:
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - "**/build/outputs/apk/**/*.apk"

# --------------------------------------------------------------------------
# version.json gegen build.gradle.kts pruefen
#
# Die App liest version.json aus dem Projekt, um neue Fassungen zu melden.
# Laufen die beiden auseinander, meldet sie entweder nichts oder etwas
# Falsches -- und man merkt es nicht, weil alles gruen ist und die APK laeuft.
#
# Geprueft wird dreierlei: gleiche Nummer, gleicher Name, und dass die
# benannte APK ueberhaupt im Projekt liegt.
versionsdatei:
  stage: test
  image: python:3.13
  timeout: 5m
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      python3 - <<'PRUEFUNG'
      import json, re, sys, pathlib

      gradle = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
      code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
      name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)

      daten = json.loads(pathlib.Path("version.json").read_text(encoding="utf-8"))
      fehler = []
      if daten.get("versionCode") != code:
          fehler.append(f"versionCode: version.json {daten.get('versionCode')} != build.gradle.kts {code}")
      if daten.get("versionName") != name:
          fehler.append(f"versionName: version.json {daten.get('versionName')!r} != build.gradle.kts {name!r}")

      # Die APK liegt seit 2.8 nicht mehr im Projekt, sondern im
      # Paketregister. Geprueft wird deshalb der Name, nicht die Datei:
      # er geht als Pfadteil in die Downloadadresse ein.
      apk = daten.get("apk", "")
      erwartet = f"BirdMic-{name}.apk"
      if apk != erwartet:
          fehler.append(f"apk: {apk!r} != erwartet {erwartet!r}")

      if fehler:
          print("version.json passt nicht zum Build:")
          for f in fehler:
              print("  -", f)
          sys.exit(1)
      print(f"version.json stimmt: {name} (Build {code}), Paket {apk}")
      PRUEFUNG

# --------------------------------------------------------------------------
# Veroeffentlichen -- APK signieren, ins Paketregister, dazu ein Release
#
# Laeuft nur auf einem geschuetzten Tag der Form v2.7. Damit ist das
# Veroeffentlichen eine bewusste Handlung und nicht die Nebenwirkung eines
# Pushes -- und nur dort kommt die geschuetzte Schluesselvariable an.
#
# Warum hier ueberhaupt signiert wird:
#
# Die APK aus `android:assemble` traegt eine WEGWERFSIGNATUR. Der Container
# ist bei jedem Job frisch, ~/.android/debug.keystore liegt nicht im Cache,
# also wuerfelt Gradle jedes Mal einen neuen Debug-Schluessel. Gemessen an
# zwei aufeinanderfolgenden Laeufen: b665a606... und 4ce0f463... -- zwei
# CI-Builds koennen sich nicht einmal gegenseitig aktualisieren.
#
# Android nimmt eine Aktualisierung aber nur an, wenn die Signatur dieselbe
# ist wie bei der installierten App. Eine falsch signierte Version bricht mit
# "App nicht installiert" ab, ohne zu sagen warum. Deshalb wird die gebaute
# APK hier mit dem echten Schluessel neu signiert -- und die Signatur danach
# gegen den erwarteten Fingerabdruck geprueft. Genau diese Pruefung hat
# gefehlt, als v2.7 das erste Mal veroeffentlicht wurde.
#
# Der Fingerabdruck ist kein Geheimnis, er steht in jeder ausgelieferten APK.
# Geheim ist nur die Schluesseldatei in ANDROID_KEYSTORE_BASE64.
#
# `extends: .android-basis` bringt das SDK aus dem Cache mit -- daher kommen
# apksigner und curl, ohne dass hier etwas nachinstalliert wird.
#
# Kein `needs`, mit Absicht: So wartet die Stufe auf `build` UND `test`
# vollstaendig. Mit `needs: android:assemble` waere die APK schon
# veroeffentlicht, waehrend die Tests noch laufen.
veroeffentlichen:
  extends: .android-basis
  stage: veroeffentlichen
  timeout: 20m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+$/'
  variables:
    # Standardwerte des Android-Debug-Schluessels. Oeffentlich bekannt und
    # kein Geheimnis -- die Sicherheit haengt an der Datei, nicht daran.
    KEYSTORE_ALIAS: "androiddebugkey"
    KEYSTORE_PASS: "android"
    # Womit jede ausgelieferte APK signiert sein MUSS.
    SIGNATUR_SOLL: "000c22b216ca8880f210b6edf3fb569485bc7f9a6c6c966f82da219b33bcbd10"
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"

      # Der Tag muss zu dem passen, was gebaut wurde. Sonst zeigt das
      # Release auf eine Datei mit anderer Versionsnummer, und niemand
      # merkt es, weil beides existiert.
      GEBAUT=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
      if [ "$VERSION" != "$GEBAUT" ]; then
        echo "FEHLER - Tag v$VERSION, aber build.gradle.kts sagt $GEBAUT."
        exit 1
      fi

      ROH=$(find . -path '*/build/outputs/apk/release/*.apk' | head -1)
      if [ -z "$ROH" ]; then
        echo "FEHLER - keine gebaute APK im Artefakt."
        exit 1
      fi

      if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        echo "FEHLER - ANDROID_KEYSTORE_BASE64 fehlt. Ohne Schluessel keine"
        echo "installierbare APK. Ist der Tag geschuetzt?"
        exit 1
      fi
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"
      ROH=$(find . -path '*/build/outputs/apk/release/*.apk' | head -1)
      APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

      # Nicht ins Protokoll, und nicht ins Artefakt.
      mkdir -p veroeffentlicht
      printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/schluessel.jks
      trap 'rm -f /tmp/schluessel.jks' EXIT

      "$APKSIGNER" sign \
        --ks /tmp/schluessel.jks \
        --ks-pass "pass:$KEYSTORE_PASS" \
        --ks-key-alias "$KEYSTORE_ALIAS" \
        --key-pass "pass:$KEYSTORE_PASS" \
        --out "veroeffentlicht/BirdMic-$VERSION.apk" \
        "$ROH"

      IST=$("$APKSIGNER" verify --print-certs "veroeffentlicht/BirdMic-$VERSION.apk" | grep -oE '[0-9a-f]{64}' | head -1)
      echo "Signatur: $IST"
      if [ "$IST" != "$SIGNATUR_SOLL" ]; then
        echo "FEHLER - falsche Signatur."
        echo "  erwartet: $SIGNATUR_SOLL"
        echo "  bekommen: $IST"
        echo "Diese APK liesse sich nicht ueber eine bestehende Installation"
        echo "aktualisieren. Es wird nichts veroeffentlicht."
        exit 1
      fi
      echo "Signatur stimmt mit der ausgelieferten Fassung ueberein."
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"
      PAKET="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/birdmic/${VERSION}/BirdMic-${VERSION}.apk"

      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "veroeffentlicht/BirdMic-$VERSION.apk" "$PAKET"
      echo "Paket liegt unter $PAKET"

      # Gegenprobe ohne Anmeldung: genau so laedt es ein Telefon.
      code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$PAKET")
      if [ "$code" != "200" ]; then
        echo "FEHLER - anonymer Abruf liefert HTTP $code."
        echo "Die App traegt kein Token; damit waere der Verweis wertlos."
        exit 1
      fi
      echo "Anonymer Abruf: HTTP 200"

      NOTIZ=$(grep -oE '"notes"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | sed 's/.*: *"//; s/"$//')
      curl --fail --silent --show-error --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"name\": \"BirdMic $VERSION\",
          \"description\": \"$NOTIZ\n\nAlle Aenderungen: [CHANGELOG.md](${CI_PROJECT_URL}/-/blob/main/CHANGELOG.md)\",
          \"assets\": { \"links\": [ {
            \"name\": \"BirdMic-$VERSION.apk\",
            \"url\": \"$PAKET\",
            \"link_type\": \"package\"
          } ] }
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" > /dev/null
      echo "Release BirdMic $VERSION angelegt"
  artifacts:
    when: on_success
    expire_in: 4 weeks
    paths:
      - "veroeffentlicht/*.apk"

# --------------------------------------------------------------------------
# Mitschnitt ueber den Runner
#
# Der Runner steht im selben Netz wie die Telefone. Damit kann er das tun,
# wofuer sonst ein Rechner laufen muesste: mehrere Streams gleichzeitig
# aufnehmen und auswerten -- nachts, ohne dass jemand wach ist.
#
# Der Job laeuft **nicht** bei jedem Push. Er braucht MITSCHNITT_DAUER, und
# das gibt es nur von Hand (Pipeline ausfuehren) oder aus einem Zeitplan.
#
# Zwei Dinge, die im Container anders sind als auf einem Rechner:
#
#   mDNS geht nicht. Multicast kommt nicht durch die Netzwerkbruecke des
#   Containers -- die Suche per _rtsp._tcp findet dort grundsaetzlich
#   nichts. Deshalb MITSCHNITT_NETZ: aufnehmen.py fragt dann jede Adresse
#   des Netzes einmal auf Port 8554 und prueft per DESCRIBE, ob wirklich
#   BirdMic antwortet.
#
#   Das eigene Netz des Containers ist das Docker-Netz, nicht das WLAN.
#   Ein automatisch ermitteltes Netz waere also das falsche. Darum steht
#   die Angabe hier ausdruecklich.
#
# Rohaudio geht **nicht** ins Artefakt: eine Stunde mit drei Geraeten sind
# rund 1 GB, die Grenze liegt bei 100 MB. Aufgehoben werden der Bericht,
# die Messwerte je Geraet und Ausschnitte um die lautesten Stellen -- damit
# laesst sich alles nachvollziehen, und man kann sich anhoeren, was da war.
mitschnitt:
  stage: test
  image: python:3.13
  # Lang genug fuer eine Nacht. Die Vorgabe von einer Stunde wuerde einen
  # laufenden Mitschnitt mittendrin abschneiden.
  timeout: 8h
  rules:
    - if: '$MITSCHNITT_DAUER'
      when: always
    - when: never
  variables:
    # Das Netz, in dem die Telefone haengen -- nicht das des Containers.
    MITSCHNITT_NETZ: "192.168.1.0/24"
    MITSCHNITT_AUSSCHNITTE: "3"
    GIT_DEPTH: "1"
  script:
    - python3 --version
    - |
      echo "Suche Geraete in $MITSCHNITT_NETZ ..."
      python3 werkzeuge/aufnehmen.py --suchen --netz "$MITSCHNITT_NETZ"
    - |
      python3 werkzeuge/aufnehmen.py \
        --dauer "$MITSCHNITT_DAUER" \
        --netz "$MITSCHNITT_NETZ" \
        --ordner mitschnitt
    - python3 werkzeuge/auswerten.py mitschnitt --ausschnitte "$MITSCHNITT_AUSSCHNITTE"
    # Der Bericht gehoert ins Protokoll, nicht nur ins Artefakt: dann steht
    # das Ergebnis da, auch wenn das Artefakt laengst abgelaufen ist.
    - cat mitschnitt/bericht.md
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - mitschnitt/*.json
      - mitschnitt/bericht.md
      - mitschnitt/ausschnitte/
    exclude:
      # Ausdruecklich, obwohl oben schon nichts passt -- wer spaeter einen
      # Pfad ergaenzt, soll nicht versehentlich Gigabytes hochladen.
      - mitschnitt/*.wav

# --------------------------------------------------------------------------
# Geraetetest -- die App gegen echte Telefone pruefen
#
# Die Tests unter app/src/test/ pruefen die Rechenteile ohne Geraet und
# ohne Netz. Genau das ist ihre Grenze: ob das fertige Telefon im WLAN
# wirklich RTSP spricht, ob RTP-Info zum ersten Paket passt, ob nach fuenf
# Sekunden ein Sender Report kommt und ob ueberhaupt Ton im Paket ist,
# wissen sie nicht.
#
# Dieser Job redet mit den laufenden Geraeten. Er braucht sie also -- und
# darf deshalb nicht bei jedem Push laufen: Ein ausgeschaltetes Telefon
# waere sonst ein roter Build ohne Fehler im Code. Er startet nur, wenn
# GERAETETEST gesetzt ist, von Hand oder aus einem Zeitplan.
#
# Das Ergebnis geht als JUnit-Bericht an GitLab und erscheint im Reiter
# "Tests" der Pipeline -- je Geraet eine Testsuite, je Zusage ein Fall.
geraetetest:
  stage: test
  image: python:3.13
  timeout: 20m
  rules:
    - if: '$GERAETETEST'
      when: always
    - when: never
  variables:
    GERAETETEST_NETZ: "192.168.1.0/24"
    # So viele Geraete muessen antworten, sonst ist der Job rot. Ein
    # stiller Erfolg ohne ein einziges geprueftes Geraet waere die
    # nutzloseste Art von gruen.
    GERAETETEST_MINDESTENS: "1"
    GIT_DEPTH: "1"
  script:
    - |
      python3 werkzeuge/pruefen.py \
        --netz "$GERAETETEST_NETZ" \
        --mindestens "$GERAETETEST_MINDESTENS" \
        --bericht geraetetest.xml
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - geraetetest.xml
    reports:
      junit: geraetetest.xml
